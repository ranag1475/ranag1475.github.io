name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          ACCB96: ${{ secrets.ACCB96 }}
          B09813: ${{ secrets.B09813 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('ACCB96', ''), os.environ.get('B09813', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 8676783fa97631f6695509f5d3dd -->', a)
          if b:
              patched = patched.replace('<!-- 2080e36a75834a0bbc9fff5c6db6703fa951540be7989694 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
